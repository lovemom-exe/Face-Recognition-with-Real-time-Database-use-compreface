services:
  postgres:
    image: postgres:16-alpine
    container_name: face_attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: face_attendance
      POSTGRES_USER: face_attendance
      POSTGRES_PASSWORD: face_attendance_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - face_attendance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U face_attendance -d face_attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  face_attendance_postgres_data:
